<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mach-Zilla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1 class="zilla-title">
      <span class="zilla-icon">🐲</span> Mach-Zilla
    </h1>
    <p class="tagline">Unleash atomic focus. Finish on time.</p>

    <div class="task-input">
      <input id="taskName" type="text" placeholder="Task name">
      <input id="targetTime" type="number" placeholder="Time (min)">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <!-- JS MUST BE LAST -->
  <script src="app.js"></script>
</body>
</html>
